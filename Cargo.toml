[package]
name = "gas_calibration"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
base64 = "0.21"
bs58 = { version = "=0.5", features = ["check"] }
clap = { version = "4.0.23", features = ["derive"] }
nnls = "0.3.0"
rayon = "1.5.3"
ndarray = { version = "0.15", features = ["approx-0_5"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
pbr = { git = "https://github.com/a8m/pb" }
massa-sc-runtime = { git = "https://github.com/massalabs/massa-sc-runtime", "rev" = "a356943983c274436e6092399667f8ea505d3388", features = [
    "gas_calibration",
] }


# massa-sc-runtime = { path = "../massa-sc-runtime", features = [
#     "gas_calibration",
# ] }
massa-models = { git = "https://github.com/massalabs/massa", package = "massa_models", tag = "MAIN.3.0" }
# massa-models = { path = "../massa/massa-models" }
massa-hash = { git = "https://github.com/massalabs/massa", package = "massa_hash", tag = "MAIN.3.0"  }
# massa-hash = { path = "../massa/massa-hash" }
massa-signature = { git = "https://github.com/massalabs/massa", package = "massa_signature", tag = "MAIN.3.0"  }
# massa-signature = { path = "../massa/massa-signature" }
massa-execution-worker = { git = "https://github.com/massalabs/massa", package = "massa_execution_worker", tag = "MAIN.3.0" , features = [
    "gas_calibration",
] }
# massa-execution-worker = { path = "../massa/massa-execution-worker", features = [
# "gas_calibration",
# ] }
rand = "0.8.5"
which = "7.0.0"
