[package]
name = "gas_calibration"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
base64 = "0.21"
bs58 = { version = "=0.5", features = ["check"] }
clap = { version = "4.0.23", features = ["derive"] }
nnls = "0.3.0"
rayon = "1.5.3"
ndarray = { version = "0.15", features = ["approx-0_5"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
pbr = { git = "https://github.com/a8m/pb" }
massa-sc-runtime = { git = "https://github.com/massalabs/massa-sc-runtime", "rev" = "82dd714d38cbcd863ae0bb215c06442917bb6404", features = [
    "gas_calibration",
] }
massa-models = { git = "https://github.com/massalabs/massa", package = "massa_models", branch = "deferred_calls" }
massa-hash = { git = "https://github.com/massalabs/massa", package = "massa_hash", branch = "deferred_calls" }
massa-signature = { git = "https://github.com/massalabs/massa", package = "massa_signature", branch = "deferred_calls" }
massa-execution-worker = { git = "https://github.com/massalabs/massa", package = "massa_execution_worker", branch = "deferred_calls", features = [
    "gas_calibration",
] }
rand = "0.8.5"
which = "7.0.0"
